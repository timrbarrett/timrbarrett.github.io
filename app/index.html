<!DOCTYPE html>
<html>

<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Limbstim</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
  <script src="main.dart.js" defer></script>

  
  <script>
    let deferredPrompt;
  
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Notify the Flutter app that the install prompt is available
      window.dispatchEvent(new Event('installpromptavailable'));
    });
  
    function promptInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          } else {
            console.log('User dismissed the install prompt');
          }
          deferredPrompt = null;
        });
      } else {
        console.log('No install prompt available');
      }
    }
  </script>
  
  <script>
    function getLaunchMode() {
      return window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser';
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const updateBannerKey = 'sw-update-banner-shown';
        const showUpdateBanner = (registration) => {
          if (document.getElementById('sw-update-banner')) return;
          if (sessionStorage.getItem(updateBannerKey) === 'true') return;

          const banner = document.createElement('div');
          banner.id = 'sw-update-banner';
          banner.style.position = 'fixed';
          banner.style.bottom = '16px';
          banner.style.left = '16px';
          banner.style.right = '16px';
          banner.style.zIndex = '9999';
          banner.style.padding = '12px 16px';
          banner.style.background = '#1f2937';
          banner.style.color = '#fff';
          banner.style.borderRadius = '8px';
          banner.style.display = 'flex';
          banner.style.alignItems = 'center';
          banner.style.justifyContent = 'space-between';
          banner.style.boxShadow = '0 8px 24px rgba(0,0,0,0.25)';

          const text = document.createElement('div');
          text.textContent = 'Update available.';

          const button = document.createElement('button');
          button.textContent = 'Update';
          button.style.marginLeft = '12px';
          button.style.padding = '8px 12px';
          button.style.border = 'none';
          button.style.borderRadius = '6px';
          button.style.background = '#10b981';
          button.style.color = '#fff';
          button.style.cursor = 'pointer';

          button.addEventListener('click', () => {
            button.disabled = true;
            button.textContent = 'Updating…';

            sessionStorage.setItem(updateBannerKey, 'true');

            if (registration.waiting) {
              registration.waiting.postMessage({ action: 'skipWaiting' });
            } else {
              registration.update();
            }

            const start = Date.now();
            const maxWaitMs = 8000;

            const poll = setInterval(async () => {
              const now = Date.now();
              if (now - start > maxWaitMs) {
                clearInterval(poll);
                window.location.reload();
                return;
              }

              const reg = await navigator.serviceWorker.getRegistration('/app/');
              if (reg && !reg.waiting && navigator.serviceWorker.controller) {
                clearInterval(poll);
                window.location.reload();
              }
            }, 500);
          });

          const right = document.createElement('div');
          right.appendChild(button);
          banner.appendChild(text);
          banner.appendChild(right);
          document.body.appendChild(banner);
        };

        navigator.serviceWorker.register('/app/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);

            // If there's already a waiting SW, show update banner immediately
            if (registration.waiting) {
              showUpdateBanner(registration);
            }

            // Check for updates on load
            registration.update();

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('SW update found, new worker installing...');

              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                console.log('SW state changed to:', newWorker.state);

                if (newWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    // New service worker ready; prompt user to update
                    showUpdateBanner(registration);
                  } else {
                    console.log('Service worker installed for the first time');
                  }
                }
              });
            });
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          sessionStorage.removeItem(updateBannerKey);
          const banner = document.getElementById('sw-update-banner');
          if (banner) banner.remove();
          window.location.reload();
        });
      });
    }

    // Handle connection status
    function updateOnlineStatus() {
      const status = navigator.onLine ? 'online' : 'offline';
      console.log('Connection status:', status);
      
      // Dispatch custom event for Flutter app to handle
      window.dispatchEvent(new CustomEvent('connectionchange', {
        detail: { status: status }
      }));
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
  </script>

</body>

</html>
