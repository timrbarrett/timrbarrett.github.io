<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Limbstim</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
  <script src="main.dart.js" defer></script>

  
  <script>
    let deferredPrompt;
  
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Notify the Flutter app that the install prompt is available
      window.dispatchEvent(new Event('installpromptavailable'));
    });
  
    function promptInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          } else {
            console.log('User dismissed the install prompt');
          }
          deferredPrompt = null;
        });
      } else {
        console.log('No install prompt available');
      }
    }
  </script>
  
  <script>
    function getLaunchMode() {
      return window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser';
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const statusShownKey = 'sw-status-shown';
        const statusShownTsKey = 'sw-status-shown-ts';
        const statusRepeatWindowMs = 10 * 1000;

        const showStatusToast = (message, color = '#1f2937') => {
          const now = Date.now();
          const lastTs = parseInt(sessionStorage.getItem(statusShownTsKey) || '0', 10);
          if (sessionStorage.getItem(statusShownKey) === 'true' && now - lastTs < statusRepeatWindowMs) {
            return;
          }

          sessionStorage.setItem(statusShownKey, 'true');
          sessionStorage.setItem(statusShownTsKey, String(now));

          const toast = document.createElement('div');
          toast.id = 'sw-status-toast';
          toast.style.position = 'fixed';
          toast.style.bottom = '16px';
          toast.style.left = '16px';
          toast.style.right = '16px';
          toast.style.zIndex = '9999';
          toast.style.padding = '10px 14px';
          toast.style.background = color;
          toast.style.color = '#fff';
          toast.style.borderRadius = '8px';
          toast.style.display = 'flex';
          toast.style.alignItems = 'center';
          toast.style.justifyContent = 'center';
          toast.style.boxShadow = '0 8px 24px rgba(0,0,0,0.25)';
          toast.textContent = message;

          const existing = document.getElementById('sw-status-toast');
          if (existing) existing.remove();

          document.body.appendChild(toast);
          setTimeout(() => {
            const el = document.getElementById('sw-status-toast');
            if (el) el.remove();
          }, 1800);
        };

        navigator.serviceWorker.register('/app/sw.js')
          .then(async (registration) => {
            console.log('SW registered: ', registration);

            await registration.update();

            const getVersionJson = async (url, cacheMode) => {
              try {
                const response = await fetch(url, { cache: cacheMode });
                if (!response.ok) return null;
                return await response.json();
              } catch (_) {
                return null;
              }
            };

            const checkBuildVersion = async () => {
              const local = await getVersionJson('/app/version.json', 'default');
              const remote = await getVersionJson(`/app/version.json?ts=${Date.now()}`, 'no-store');

              if (!local || !remote) {
                showStatusToast('Up to date', '#1f2937');
                return;
              }

              const localHash = local.commitHash || '';
              const remoteHash = remote.commitHash || '';
              const localBuild = Date.parse(local.buildDate || '');
              const remoteBuild = Date.parse(remote.buildDate || '');

              const sameVersion = (localHash && remoteHash && localHash === remoteHash) ||
                (!isNaN(localBuild) && !isNaN(remoteBuild) && localBuild === remoteBuild);

              if (sameVersion) {
                showStatusToast('Up to date', '#1f2937');
              } else {
                showStatusToast('Update available', '#6b21a8');
              }
            };

            setTimeout(() => {
              checkBuildVersion();
            }, 600);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }

    // Handle connection status
    function updateOnlineStatus() {
      const status = navigator.onLine ? 'online' : 'offline';
      console.log('Connection status:', status);
      
      // Dispatch custom event for Flutter app to handle
      window.dispatchEvent(new CustomEvent('connectionchange', {
        detail: { status: status }
      }));
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
  </script>

</body>

</html>
