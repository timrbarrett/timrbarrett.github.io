<body>
  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
  <script src="main.dart.js" defer></script>

  
  <script>
    let deferredPrompt;
  
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Notify the Flutter app that the install prompt is available
      window.dispatchEvent(new Event('installpromptavailable'));
    });
  
    function promptInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          } else {
            console.log('User dismissed the install prompt');
          }
          deferredPrompt = null;
        });
      } else {
        console.log('No install prompt available');
      }
    }
  </script>
  
  <script>
    function getLaunchMode() {
      return window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser';
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/app/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
            
            // Track if we've already shown an update prompt
            let updatePromptShown = false;
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('SW update found, new worker installing...');
              
              newWorker.addEventListener('statechange', () => {
                console.log('SW state changed to:', newWorker.state);
                
                if (newWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller && !updatePromptShown) {
                    // There's an existing service worker and a new one is ready
                    updatePromptShown = true;
                    console.log('New service worker ready');
                    
                    // Only prompt if this is a genuine update (not initial load)
                    if (sessionStorage.getItem('sw-initial-load') === 'true') {
                      if (confirm('New version available! Refresh to update?')) {
                        newWorker.postMessage({ action: 'skipWaiting' });
                        window.location.reload();
                      }
                    } else {
                      console.log('Initial load, not prompting for update');
                    }
                  } else if (!navigator.serviceWorker.controller) {
                    // First time installation
                    console.log('Service worker installed for the first time');
                    sessionStorage.setItem('sw-initial-load', 'true');
                  }
                }
              });
            });

            // Listen for service worker taking control
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              console.log('Service worker took control');
              // Only reload if we explicitly triggered skipWaiting
              if (sessionStorage.getItem('sw-should-reload') === 'true') {
                sessionStorage.removeItem('sw-should-reload');
                window.location.reload();
              }
            });
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }

    // Handle connection status
    function updateOnlineStatus() {
      const status = navigator.onLine ? 'online' : 'offline';
      console.log('Connection status:', status);
      
      // Dispatch custom event for Flutter app to handle
      window.dispatchEvent(new CustomEvent('connectionchange', {
        detail: { status: status }
      }));
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
  </script>

</body>

</html>
