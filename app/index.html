<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Limbstim</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Limbstim offline cache registered'))
          .catch((error) => console.log('Offline cache registration failed:', error));
      }
    });
  </script>
  <script src="flutter.js" defer></script>
  <script src="flutter_bootstrap.0.598-e884fdb-20260904-094637.js" defer></script>

  
  <script>
    let deferredPrompt;
  
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Notify the Flutter app that the install prompt is available
      window.dispatchEvent(new Event('installpromptavailable'));
    });
  
    function promptInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          } else {
            console.log('User dismissed the install prompt');
          }
          deferredPrompt = null;
        });
      } else {
        console.log('No install prompt available');
      }
    }
  </script>
  
  <script>
    function getLaunchMode() {
      return window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser';
    }
  </script>

  <script>
    // Handle connection status
    function updateOnlineStatus() {
      const status = navigator.onLine ? 'online' : 'offline';
      console.log('Connection status:', status);
      
      // Dispatch custom event for Flutter app to handle
      window.dispatchEvent(new CustomEvent('connectionchange', {
        detail: { status: status }
      }));
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
  </script>

</body>

</html>
